name: Pruebas NOIR

on:
  push:
    branches: [noir/atomic-jsonstorage]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: pip install -r requirements-noir.txt
      - name: Pruebas HU1-HU3
        run: python -m pytest -o addopts= tests/test_atomic_storage.py -v
      - name: Suite completa
        run: python -m pytest -o addopts= -v
      - name: Analisis estatico (estilo)
        run: python -m pycodestyle tinydb/storages.py tests/test_atomic_storage.py
